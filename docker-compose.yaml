services:
  db:
    image: postgres:15.3-alpine
    container_name: inventory_db
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: inventory_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sa"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: {}
